{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="row py-2">
<p class="fs-3 text-center">Veg<b class="text-mycolor1">Menu</b></p>
        <hr class="w-25 mx auto" />
        <div class="col-sm-10 mx-auto">
            <div class="row py-3">
              {% for x in mdata %}
                <!--Menu First Start-->
                <div class="col-sm-4">
                <div class="card mb-3 mx-auto shadow-lg border border-0">
  <div class="row g-0">
    
    <div class="col-md-8">
      <span class="position-absolute top-0 start-100 translate-middle badge bg-mycolor1">
        {{ x.itemtype }}
      </span>
      <div class="card-body">
        <h6 class="card-title">{{x.itemname}}</h6>
        <p class="card-text" style="font-size:13px;">{{x.detail}}</p>
        <p class="card-text"><small class="text-light bg-success rounded-3 p-1 ">{{x.rate}}</small>
        <small class="text-light bg-danger rounded-3 p-1 ">{{x.salerate}}</small></p>
      </div>
    </div>
    <div class="col-md-4 p-3">
      <img src="../{{x.picture}}" class="img-fluid rounded-3 menuimg w-100" alt="...">
    </div>
  </div>
</div>
                </div>
                
                  <!--Menu First end-->
                  {% endfor %}
            </div>
        </div>
        </div>
{% endblock %}
