{% extends 'base.html' %}
{% load static %}
{% block content %}

<!--start gallery -->
<div class="row gallery py-4">
    <p class="fs-3 text-center">Images <b class="text-mycolor1">Gallery</b></p>
    <hr class="w-25 mx-auto"/>
    <div class="col-sm-10 mx-auto" >
     <div class="row">
      {% for r in gdata %}
      <div class="col-sm-3">
        <div class="card shadow-lg my-2">
          <img src="../{{r.picture}}" class="card-img-top">
          <p class="p-2">{{r.title}}</p>
        </div>
      </div>
      {% endfor %}
     </div>



    </div>

    
    </div>

{% endblock %}
